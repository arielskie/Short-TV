<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="50%" stop-color="#1f1f23"/>
      <stop offset="100%" stop-color="#161619"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 45, 85, 0.08)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
    <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Solid 9:16 Dark / Grey Gradient Background -->
  <rect width="540" height="960" fill="url(#bgGrad)"/>
  
  <!-- Subtle Center Radial Glow -->
  <circle cx="270" cy="480" r="240" fill="url(#centerGlow)"/>

  <!-- Centered ShortTV App Icon -->
  <g transform="translate(135, 345)" filter="url(#logoShadow)">
    <image href="icon-512.png" width="270" height="270" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
