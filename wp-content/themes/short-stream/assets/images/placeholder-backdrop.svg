<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="none">
  <defs>
    <radialGradient id="heroGlow" cx="65%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="55%" stop-color="#101420"/>
      <stop offset="100%" stop-color="#080a10"/>
    </radialGradient>
  </defs>
  <!-- Main Backdrop -->
  <rect width="1920" height="1080" fill="url(#heroGlow)"/>
  
  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="1300" cy="450" r="350" fill="rgba(255,255,255,0.015)"/>
  <circle cx="600" cy="650" r="280" fill="rgba(255,255,255,0.01)"/>
  
  <!-- Bottom Vignette Gradient -->
  <rect x="0" y="700" width="1920" height="380" fill="url(#heroGlow)" opacity="0.6"/>
